# Tiny Tapeout project information
project:
  title:        "Four Branch Predictors: Perceptron, Bimodal, gshare, Tournament"      # Project title
  author:       "Ilma Kule, Kyrylo Nazarevych, Vitalii Haponenko, Märten Erik Loor"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "704 perceptron predictor plus bimodal, gshare and tournament predictors, scored on RISC-V branch traces"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kyrylo_nazarevych_bp"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "latch_memory.v"
    - "perceptron_704.v"
    - "predictors.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "PC bit 0"
  ui[1]: "PC bit 1"
  ui[2]: "PC bit 2"
  ui[3]: "PC bit 3"
  ui[4]: "PC bit 4"
  ui[5]: "PC bit 5"
  ui[6]: "PC bit 6"
  ui[7]: "PC bit 7"

  # Outputs
  uo[0]: "Perceptron prediction ready"
  uo[1]: "Perceptron prediction"
  uo[2]: "Training done (send next branch)"
  uo[3]: "Memory reset done"
  uo[4]: "Bimodal prediction"
  uo[5]: "gshare prediction"
  uo[6]: "Tournament prediction"
  uo[7]: "Perceptron state bit (debug)"

  # Bidirectional pins
  uio[0]: "New branch strobe (rising edge, input)"
  uio[1]: "Branch taken (real outcome, input)"
  uio[2]: "Perceptron index bit 0 (debug output)"
  uio[3]: "Perceptron index bit 1 (debug output)"
  uio[4]: "Perceptron index bit 2 (debug output)"
  uio[5]: "Perceptron memory write enable (debug output)"
  uio[6]: "History buffer serial out (debug output)"
  uio[7]: "History buffer request (input)"

# Do not change!
yaml_version: 6
